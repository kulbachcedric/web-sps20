[model]
name = Photo Gallery
label = {{ this.title }}
template = photos.html

[fields.title]
label = Title
type = string
width = 3/4

[fields.year]
label = Summit year
type = integer
width = 1/4

[fields.description]
label = Description
type = string
description = Short description for search engines and the archive page

[fields.gallery_bag]
label = Gallery data bag
type = string
description = Data bag name, for example photos-2026

[fields.kicker]
label = Intro kicker
type = string

[fields.headline_first]
label = Headline, first line
type = string
width = 1/2

[fields.headline_second]
label = Headline, second line
type = string
width = 1/2

[fields.intro]
label = Intro text
type = markdown
